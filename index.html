<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>品質管理企劃教室</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#193b3b;background:#f3f5ef}*{box-sizing:border-box}body{margin:0}header{background:#183e3c;color:white;padding:40px max(5vw,20px)}header small{color:#c4d7bc}h1{font-size:clamp(26px,4vw,42px);margin:12px 0}header p{max-width:750px;line-height:1.8}.layout{display:grid;grid-template-columns:230px minmax(0,850px);gap:32px;max-width:1180px;margin:32px auto;padding:0 20px}nav{position:sticky;top:20px;align-self:start}nav a{display:block;color:#245551;padding:12px;text-decoration:none;border-left:3px solid #adc3ad;margin:8px 0}main{min-width:0}section{background:white;padding:28px;margin-bottom:24px;border:1px solid #dce4da;border-radius:8px;scroll-margin-top:20px}h2{font-size:23px;margin-top:0}label{display:block;font-weight:650;margin:20px 0 8px}input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #95aaa1;border-radius:4px;color:#163c39;background:white}textarea{min-height:120px;resize:vertical;line-height:1.7}button,.button{font:inherit;background:#245c53;color:white;border:0;border-radius:4px;padding:11px 17px;cursor:pointer;text-decoration:none;display:inline-block;margin:5px 3px 5px 0}button.secondary{background:#e9eee5;color:#24473c}button:disabled{opacity:.5;cursor:wait}.note{background:#e9efe4;padding:16px;line-height:1.8}.member{display:grid;grid-template-columns:1fr 1.3fr 90px 65px;gap:8px;margin:12px 0}.member button{margin:0;background:#e9eee5;color:#24473c}#status{line-height:1.8;font-weight:650;white-space:pre-wrap}footer{padding:25px;text-align:center}input:focus,textarea:focus,button:focus-visible,select:focus{outline:3px solid #ccaa53;outline-offset:2px}.check{display:flex;gap:10px;align-items:start}.check input{width:auto;margin-top:5px}small{line-height:1.7}.tools{margin:18px 0}@media(max-width:760px){.layout{display:block}nav{position:static;display:flex;overflow:auto;gap:10px}nav a{white-space:nowrap}.member{grid-template-columns:1fr 1fr}.member select,.member button{width:100%}section{padding:20px}}@media print{nav,.tools,button,#connection,.check{display:none}.layout{display:block;margin:0}section{break-inside:avoid;border:0}textarea{min-height:initial}header{padding:20px;color:black;background:white}input,textarea,select{border:0}}
</style></head><body><header><small>大四企劃案 · 職能導向課程設計</small><h1>品質管理企劃教室</h1><p>從工作問題出發，設計一門讓入職新人能完成真實任務的課程。選擇醫院或長照場域，依需求、職能、課程、評量與改善逐步完成企劃。</p></header><div class="layout"><nav id="nav" aria-label="填寫段落"></nav><main><p class="note">教學演練版，參考所提供 iCAP 報告書格式。此作業不代表 iCAP 認證或正式申請。請使用模擬資料，不填病人、住民或機構機密資料。姓名與學號僅用於教師評量。</p><div class="tools"><button id="hospital" class="secondary" type="button">載入醫院範例</button><button id="care" class="secondary" type="button">載入長照範例</button><button id="export" class="secondary" type="button">下載備份</button><label class="button">匯入備份<input type="file" id="import" accept="application/json" hidden></label><button id="print" class="secondary" type="button">列印</button><button id="clear" class="secondary" type="button">清除本機草稿</button></div><form id="planner"><section id="students"><h2>學生與主題</h2><label for="track">企劃主題</label><select id="track" name="track"><option>醫院品質管理企劃課</option><option>長照機構品質管理企劃課</option></select><label for="phase">成果狀態</label><select id="phase" name="phase"><option>規劃中，尚未試辦</option><option>已完成教學試辦</option></select><label for="classCode">教師提供的課程代碼（送出時必填）</label><input id="classCode" autocomplete="off"><p>請填寫您的姓名、學號與年級。每份企劃僅限一位同學。</p><div id="members"></div><button type="button" id="addMember" hidden class="secondary">新增組員</button></section><div id="sections"></div><section id="connection"><h2>提交企劃</h2><p id="connectionState" class="note"></p><label class="check"><input id="consent" type="checkbox" required>我確認資料用於課堂評量，並且已區分模擬資料、預計成果與實際證據。</label><button id="submit" type="submit">提交到教師試算表</button><p id="status" role="status" aria-live="polite"></p><small id="draftStatus">草稿只儲存在此瀏覽器；共用電腦使用後請清除。</small></section></form></main></div><footer>品質管理企劃教室 · 需求 → 職能 → 訓練 → 證據 → 改善</footer><script>
const WEB_APP_URL = ''; // 教師部署 Apps Script 後填入 /exec 網址
const SECTIONS = [["基本資料", [["project", "企劃案名稱", "例如：長照機構新人異常事件通報培訓"], ["team", "班級", "例如：醫管四甲第 3 組"], ["courseEn", "課程英文名稱（選填）", ""], ["unit", "規劃／協力單位", "使用模擬機構名稱"], ["period", "預計辦訓期間", "起訖日期"]]], ["壹、課程資訊", [["need", "訓練需求", "問題現況、需求調查方法、落差及資料來源；限 1000 字"], ["intro", "課程簡介", "描述新人完成課程後能處理的工作；限 1000 字"], ["purpose", "課程目的", "寫成可觀察、可評量的工作表現；限 1000 字"], ["hours", "總時數", "數字，例如 12"], ["level", "職能級別及判斷理由", "依職能來源填寫；無可驗證依據時填「待分析」，勿自行宣稱官方級別"], ["audience", "主要對象／參訓資格", "到職 3 個月內之品質管理行政新人"], ["prerequisite", "先備條件", "基本文書能力、機構入職訓練等"], ["basis", "職能依據與來源", "預設採自行職能分析：職務訪談、工作流程、來源日期及連結"]]], ["表 1–2｜職能分析與課程地圖", [["competencies", "表 1：職能表", "逐列填寫：任務代碼／中英文任務／行為指標 P／級別 L／知識 K／技能 S。\n例 T1：依模擬資料計算指標；P1 正確定義分子分母；K1 指標定義；S1 試算表計算。"], ["map", "表 2：課程地圖", "先備條件 → 單元順序 → 對應任務 → 評量 → 工作應用；可填圖檔的非公開連結"]]], ["表 3–8｜課程設計", [["objectives", "表 3：教學訓練目標與職能內涵", "逐單元：中英文名稱／級別／目標／P／K／S。目標包含條件、行為與達成標準。"], ["content", "表 4：課程內容與時數", "逐單元：名稱／時數／大綱；各單元時數加總應等於總時數"], ["methods", "表 5：教學方法", "逐單元：目標／方法／選用理由，如案例、示範、演練、討論"], ["resources", "表 6：教材與資源", "逐單元：教材名稱／設備／來源／授權；全部採模擬或去識別資料"], ["faculty", "表 7：師資條件", "逐單元：授課教師／評量人員／協助人員的資格條件"], ["assessment", "表 8：評量方式與工具", "逐單元：對應 P／評量方式／工具／評分規準／達標門檻；不要只用滿意度當能力證據"]]], ["表 9–12｜實施與評估", [["staff", "表 9：實際執行人員資格", "未試辦填「未執行」；已試辦填各單元人員角色與資格，勿填未經同意的個資"], ["pilot", "表 10：試辦成果", "未試辦填「預計」並列招募、時程、預計人數；已試辦填日期、參訓／完訓／達教學結訓標準人數"], ["evidence", "表 11：學習成果證據", "逐單元：作品／評量表／操作紀錄／證據連結；註明預計或實際"], ["completion", "表 12：課程結訓標準", "至少一項：各階段、學科、術科或其他；例指標計算 80 分且通報檢核全部關鍵項通過"]]], ["參、ADDIE 佐證與改善", [["addie", "分析／設計／發展／執行／評估佐證", "A 職能分析、需求訪談；D 課程目標／教材；I 試辦紀錄；E 工具、成果、成績及管控改善。逐項註明資料狀態。"], ["stakeholders", "利益關係人參與紀錄", "模擬訪談或真實訪談請分清楚；記錄角色、日期、意見及如何改課程"], ["improvement", "品質改善企劃：PDCA、指標與時程", "問題、基準值、目標、原因分析、措施、負責角色、期限、指標定義、資料來源、檢討；數值註明假設"], ["references", "參考文獻與 AI 使用揭露", "來源網址／查閱日期／採用內容；AI 協助部分及人工查核方式"]]]];
const FIELDS=SECTIONS.flatMap(s=>s[1].map(f=>f[0]));
const $=id=>document.getElementById(id), form=$('planner');
const native=typeof google!=='undefined'&&google.script&&google.script.run;
$('connectionState').textContent=native?'已開啟教師提交系統。送出成功後會顯示儲存回執。':WEB_APP_URL?'已設定教師收件系統，送出後將開啟儲存回執視窗。':'目前為可填寫的展示版；Google Sheet 尚未連接。可先下載備份；請教師依 GitHub 操作文件完成連接。';
SECTIONS.forEach(([title,fields],i)=>{const sec=document.createElement('section');sec.id='s'+i;const h=document.createElement('h2');h.textContent=title;sec.append(h);fields.forEach(([key,label,hint])=>{const l=document.createElement('label');l.htmlFor=key;l.textContent=label;let input=document.createElement(['project','team','hours','courseEn','unit','period'].includes(key)?'input':'textarea');input.id=key;input.name=key;input.placeholder=hint;input.maxLength=['need','intro','purpose'].includes(key)?1000:6000;if(key==='hours'){input.type='number';input.min='0.5';input.max='1000';input.step='0.5'}if(['project','team','need','purpose','hours','basis','competencies','map','objectives','content','assessment','completion','improvement'].includes(key))input.required=true;sec.append(l,input)});$('sections').append(sec);const a=document.createElement('a');a.href='#s'+i;a.textContent=title;$('nav').append(a)});
function addMember(m={}){if($('members').children.length>=1)return;const row=document.createElement('div');row.className='member';['name','studentId'].forEach((key,i)=>{const el=document.createElement('input');el.dataset.key=key;el.placeholder=i?'學號':'姓名';el.setAttribute('aria-label',i?'學號':'姓名');el.required=true;el.maxLength=60;el.value=m[key]||'';row.append(el)});const select=document.createElement('select');select.dataset.key='grade';select.setAttribute('aria-label','年級');['一','二','三','四','其他'].forEach(x=>select.add(new Option(x+'年級',x+'年級')));select.value=m.grade||'四年級';row.append(select);const b=document.createElement('button');b.type='button';b.textContent='移除';b.onclick=()=>{if($('members').children.length===1)return;row.remove();save()};b.hidden=true;row.append(b);$('members').append(row)}
function data(){const d={schemaVersion:1,submissionId:requestId,track:$('track').value,phase:$('phase').value,members:[...$('members').children].map(r=>Object.fromEntries([...r.querySelectorAll('[data-key]')].map(e=>[e.dataset.key,e.value.trim()])))};FIELDS.forEach(k=>d[k]=$(k).value.trim());return d}
let requestId=crypto.randomUUID();
function restore(d){if(!d||d.schemaVersion!==1||!Array.isArray(d.members)||!d.members.length||d.members.length!==1)throw Error('備份格式不符');requestId=typeof d.submissionId==='string'?d.submissionId:crypto.randomUUID();FIELDS.forEach(k=>$(k).value=typeof d[k]==='string'?d[k]:'');if(['醫院品質管理企劃課','長照機構品質管理企劃課'].includes(d.track))$('track').value=d.track;if(['規劃中，尚未試辦','已完成教學試辦'].includes(d.phase))$('phase').value=d.phase;$('members').replaceChildren();d.members.forEach(addMember)}
function save(){try{localStorage.setItem('quality-planner-v1',JSON.stringify(data()));$('draftStatus').textContent='已儲存本機草稿。共用電腦使用後請清除；課程代碼不存入草稿。'}catch(e){$('draftStatus').textContent='此瀏覽器無法儲存草稿，請下載備份。'}}
try{const old=localStorage.getItem('quality-planner-v1');if(old)restore(JSON.parse(old));else addMember()}catch(e){addMember();$('status').textContent='無法還原草稿，請匯入備份。'}
form.addEventListener('input',save);$('addMember').onclick=()=>{addMember();save()};
function download(d){const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='品質管理企劃備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=()=>download(data());$('import').onchange=async e=>{try{restore(JSON.parse(await e.target.files[0].text()));save();$('status').textContent='已匯入備份。'}catch(err){$('status').textContent='匯入失敗：'+err.message}e.target.value=''};
$('clear').onclick=()=>{if(confirm('清除本機草稿與目前內容？請先下載備份。')){try{localStorage.removeItem('quality-planner-v1')}catch(e){}location.reload()}};
$('print').onclick=()=>{document.querySelectorAll('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'});window.print()};
function example(care){if(!confirm('將覆蓋企劃內容，學生資料會保留。建議先下載備份。'))return;const topic=care?'長照機構':'醫院';FIELDS.forEach(k=>$(k).value='');$('track').value=topic+'品質管理企劃課';$('phase').value='規劃中，尚未試辦';const d={project:topic+'入職新人品質指標與異常事件通報課程',team:'四年級班級（請修改）',hours:'12',need:'【模擬情境】新人對品質指標分子分母與異常事件通報流程不熟悉。規劃以主管訪談、匿名問卷與模擬資料測驗分析需求；目前尚無真實調查結果。',intro:'以去識別模擬案例，練習指標計算、問題分析、通報與改善提案。',purpose:'給定模擬資料與流程圖，新人能正確計算兩項指標，完成通報演練，並提出可追蹤的 PDCA 改善計畫。',audience:'到職三個月內品質管理行政新人；實務案例由合格專業人員審查。',prerequisite:'具基本文書與試算表能力；已完成機構入職訓練。',level:'待職務分析確認，不宣稱官方職能級別。',basis:'自行職能分析（教學草案）。預計訪談品質主管與資深人員，蒐集 SOP、工作流程並註明版本。',competencies:'T1 指標資料整理；P1 依定義選取分子分母並核對資料；K1 指標定義與資料品質；S1 試算表計算。\nT2 異常事件通報；P2 依模擬流程完成全部關鍵欄位；K2 機構通報流程；S2 紀錄、溝通。\nT3 改善企劃；P3 提出含指標、時程與負責角色的 PDCA；K3 根因分析；S3 企劃撰寫。',map:'入職及文書能力 → 單元1 指標與資料 → 單元2 通報演練 → 單元3 原因分析 → 單元4 PDCA 提案 → 實作評量',objectives:'單元1 對應 P1：給定模擬資料計算兩項指標，正確率至少 80%。\n單元2 對應 P2：完成通報案例，關鍵項目全部通過。\n單元3/4 對應 P3：提出可追蹤改善方案，量規至少 80 分。',content:'單元1 品質概念與指標計算 3 小時。\n單元2 異常事件紀錄與通報 3 小時。\n單元3 問題界定與根因分析 3 小時。\n單元4 PDCA 提案與成果展示 3 小時。合計 12 小時。',methods:'單元1 示範與演練；單元2 案例與角色演練；單元3 討論與原因分析；單元4 專題與口頭報告。',resources:'模擬資料表、機構示意 SOP、案例卡、魚骨圖、PDCA 工作表、電腦與投影設備；教材預計自行製作。',faculty:'授課與評量：具該場域品質管理實務經驗及教學能力；課程協助：熟悉試算表與教學紀錄。',assessment:'P1 試算表實作，計算正確率 80% 以上。\nP2 通報情境演練，檢核表關鍵項全部通過。\nP3 PDCA 作業量規：問題與證據 25、原因 20、措施 25、指標 20、呈現 10；至少 80 分。',staff:'未執行；預計依表7選任。',pilot:'【預計】招募 10 位模擬學員，依 12 小時課程進行教學試辦。尚無實際參訓、完訓與結訓資料。',evidence:'【預計】指標計算作業、通報檢核表、原因分析圖、PDCA 提案、前後測及回饋表。',completion:'指標計算至少80分；通報所有關鍵項通過；改善提案至少80分。不使用 iCAP 認證字樣。',addie:'A 預計需求訪談與職能分析；D 預計課程地圖、教材及評量表；I 預計試辦紀錄；E 預計成果評量與改善紀錄。',stakeholders:'尚未訪談；預計邀請品質主管、資深人員、入職新人及教學者檢視需求與教材。',improvement:'【模擬假設】以新人通報完整率為指標：分子=關鍵欄位完整的通報件數；分母=全部模擬通報件數。假設基準60%、目標90%。P 分析欄位遺漏原因；D 培訓與提示卡；C 每週抽核；A 修訂教材。所有數字為教學假設。',references:'待補：職務訪談紀錄、SOP 版本、教材來源及查閱日期。若使用 AI，記錄用途並由人工查核。'};Object.entries(d).forEach(([k,v])=>$(k).value=v);requestId=crypto.randomUUID();save()}
$('hospital').onclick=()=>example(false);$('care').onclick=()=>example(true);
form.onsubmit=e=>{e.preventDefault();$('status').textContent='';if(!$('classCode').value.trim()){$('status').textContent='請填入教師提供的課程代碼。';$('classCode').focus();return}const payload={...data(),classCode:$('classCode').value.trim()};if(!native&&!WEB_APP_URL){$('status').textContent='尚未連接 Google Sheet，未送出。請下載備份。';return}$('submit').disabled=true;if(native){google.script.run.withSuccessHandler(r=>{$('submit').disabled=false;$('status').textContent='已存入教師試算表。回執：'+r.receipt+'\n時間：'+r.savedAt;requestId=crypto.randomUUID();save()}).withFailureHandler(err=>{$('submit').disabled=false;$('status').textContent='未確認儲存成功：'+err.message+'。可保留草稿後重試。'}).submitProposal(payload)}else{const post=document.createElement('form');post.method='POST';post.action=WEB_APP_URL;post.target='_blank';const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);post.append(input);document.body.append(post);post.submit();post.remove();$('submit').disabled=false;$('status').textContent='已開啟收件回執視窗。請以該視窗的「儲存成功」與回執編號確認；此頁尚未確認成功。'}};
</script></body></html>
