</style></head><body><header><small>職能導向課程企劃 · 學生個別作業／教師編輯個案</small><h1>品質管理企劃教室</h1><p>逐段完成需求分析，逐列建立職能與課程，再設計評量、試辦與改善。每個段落與表格都能獨立存檔，分次完成。</p></header><div id="app"><div class="layout"><nav id="nav" aria-label="填寫步驟"></nav><main><div class="panel"><div class="identity"><div><label for="identityType">填寫身分</label><select id="identityType"><option>學生</option><option>教師／作者</option></select></div><div><label for="studentName" id="nameLabel">學生姓名</label><input id="studentName" maxlength="60" autocomplete="name"></div><div><label for="studentId">學號</label><input id="studentId" maxlength="60" inputmode="text"></div><div><label for="grade">年級</label><select id="grade"><option>四年級</option><option>三年級</option><option>二年級</option><option>一年級</option><option>其他年級</option><option>不適用（教師／作者）</option></select></div><div><label for="className" id="classLabel">班級</label><input id="className" maxlength="100"></div><div><label for="track">企劃主題</label><select id="track"><option>醫院品質管理企劃課</option><option>長照機構品質管理企劃課</option><option>宮廟管理職能導向種子師資培訓課程</option></select></div><div><label for="classCode">教師課程代碼（雲端存檔用）</label><input id="classCode" autocomplete="off"></div></div><p class="note" id="connection"></p><p class="hint">教學演練版，對應您提供的 iCAP 格式；不代表正式申請或認證。請填模擬資料，勿填病人／住民個資。共用電腦使用後請清除草稿。備份含個人作業續填密鑰，請自行保管。</p><div class="actions"><a class="button secondary" href="https://chatgptcjcu-boop.github.io/healthcare-quality-course-planner/case.html" target="_blank">閱讀完整長照案例</a><button id="caseLoad" class="secondary">載入長照完整教學案例</button><button id="backup" class="secondary">下載整份備份</button><label class="button secondary">匯入備份<input id="import" type="file" accept="application/json" hidden></label><button id="loadCloud" class="secondary">讀回我的雲端存檔</button><button id="print" class="secondary">列印整份報告</button><button id="reset" class="secondary">開始新企劃</button></div><details><summary>貼上備份內容</summary><p class="hint">載入會替換本機草稿；請先下載目前備份。雲端歷史不會刪除。</p><label for="backupText">完整備份 JSON 內容</label><textarea id="backupText"></textarea><button id="pasteImport" class="secondary">載入貼上的備份（替換本機草稿）</button></details><p id="progress" aria-live="polite"></p><p id="globalStatus" class="message" role="status"></p></div><div id="sections"></div><div class="panel"><h2>整份作業檢核與提交</h2><label class="consent"><input id="consent" type="checkbox">我確認此資料用於課程企劃或教學，並已標註草案／預計／實際資料。</label><button id="review" class="secondary">檢查整份作業</button><button id="submit">完成並提交整份企劃</button><p id="reviewResult" class="message" role="status"></p></div></main></div></div><article id="report"></article><footer>需求 → 職能 → 訓練 → 證據 → 改善 · 存檔帳號：chatgpt.cjcu@gmail.com</footer><script>

$('caseLoad').onclick=()=>{if(!confirm('載入完整教學案例會覆蓋全部企劃內容，保留學生資料；請先下載目前備份。案例全部為虛構，不會自動提交。'))return;draft.sections=JSON.parse(JSON.stringify(TEACHING_CASE.sections));draft.student.track=TEACHING_CASE.track;draft.projectId=uuid();draft.editKey=uuid()+uuid();draft.saved={};draft.active=0;pending={};finalRequest=null;$('track').value=draft.student.track;persist();render();$('globalStatus').textContent='已載入完整虛構長照案例。請逐段操作與存檔；目前未自動提交。';};

</script></body></html>
