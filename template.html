:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#183e3c;background:#f3f5ef}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{background:#183e3c;color:white;padding:28px max(4vw,20px)}h1{font-size:clamp(26px,4vw,38px);margin:8px 0}header p{line-height:1.7;max-width:850px}header small{color:#c8dcbf}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;max-width:1450px;margin:24px auto;padding:0 20px}nav{align-self:start;position:sticky;top:15px;max-height:85vh;overflow:auto}nav button{display:block;text-align:left;width:100%;background:transparent;color:#23473f;border-left:3px solid #bacab5;border-radius:0;font-size:14px;margin:0 0 4px;padding:9px}nav button[aria-current=step]{background:#dfeadc;border-color:#245c53;font-weight:750}.panel{background:white;border:1px solid #d9e3d6;border-radius:6px;padding:24px;margin-bottom:20px}main{min-width:0}h2{font-size:24px;margin:0 0 14px}.note{background:#eaf0e6;padding:14px;line-height:1.8}.identity{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-weight:650;margin:14px 0 7px}input,textarea,select{font:inherit;color:inherit;width:100%;background:white;border:1px solid #91a79d;border-radius:4px;padding:10px}textarea{min-height:100px;resize:vertical;line-height:1.7}input:focus,textarea:focus,button:focus-visible,select:focus{outline:3px solid #c0a151;outline-offset:2px}button,.button{display:inline-block;font:inherit;background:#245c53;color:white;border:0;border-radius:4px;padding:10px 15px;cursor:pointer;margin:5px 4px 5px 0;text-decoration:none}button.secondary,.button.secondary{background:#e7ede2;color:#23473f}button:disabled{opacity:.45;cursor:wait}.tablewrap{overflow-x:auto;border:1px solid #d8e3d2;margin-top:18px}table{border-collapse:collapse;width:100%}th{background:#e8eee3;text-align:left;padding:12px;vertical-align:top}td{vertical-align:top;padding:10px;border-top:1px solid #d8e3d2;min-width:175px}td:first-child{min-width:50px}td label{font-size:13px;font-weight:400;margin:0 0 8px}td textarea{min-height:105px}fieldset{border:0;margin:0;padding:0}fieldset label{font-weight:400;display:flex;gap:8px;align-items:start;margin:9px 0}fieldset input{width:auto;margin-top:4px}.actions{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:20px}.meta{font-size:13px;color:#4c6558;line-height:1.8}.message{white-space:pre-wrap;line-height:1.8}.error{color:#8a3324}.hint{font-size:13px;color:#536752;line-height:1.7}.statusline{border-top:1px solid #d6e2d0;padding-top:12px;margin-top:12px}#progress{font-weight:650}.consent{display:flex;gap:10px;align-items:start}.consent input{width:auto;margin-top:6px}.badge{font-size:12px;background:#e8ede2;padding:4px 8px}.cloudFrame{width:100%;height:95vh;border:0}#report{display:none}footer{text-align:center;padding:22px;font-size:13px}@media(max-width:760px){.layout{display:block;padding:0 12px}nav{position:static;display:flex;max-height:none;margin-bottom:15px;gap:6px}nav button{width:auto;white-space:nowrap}.identity{grid-template-columns:1fr}.panel{padding:18px}.actions button{flex-grow:1}}@media print{header,#app,footer{display:none}#report{display:block;color:black}#report section{break-inside:avoid;margin:20px 0}#report p{white-space:pre-wrap}#report table{font-size:10px}#report td{min-width:0;white-space:pre-wrap}#report th{background:#eee}}
</style></head><body><header><small>職能導向課程企劃 · 學生個別作業／教師編輯個案</small><h1>品質管理企劃教室</h1><p>逐段完成需求分析，逐列建立職能與課程，再設計評量、試辦與改善。每個段落與表格都能獨立存檔，分次完成。</p></header><div id="app"><div class="layout"><nav id="nav" aria-label="填寫步驟"></nav><main><div class="panel"><div class="identity"><div><label for="identityType">填寫身分</label><select id="identityType"><option>學生</option><option>教師／作者</option></select></div><div><label for="studentName" id="nameLabel">學生姓名</label><input id="studentName" maxlength="60" autocomplete="name"></div><div><label for="studentId">學號</label><input id="studentId" maxlength="60" inputmode="text"></div><div><label for="grade">年級</label><select id="grade"><option>四年級</option><option>三年級</option><option>二年級</option><option>一年級</option><option>其他年級</option><option>不適用（教師／作者）</option></select></div><div><label for="className" id="classLabel">班級</label><input id="className" maxlength="100"></div><div><label for="track">企劃主題</label><select id="track"><option>醫院品質管理企劃課</option><option>長照機構品質管理企劃課</option><option>宮廟管理職能導向種子師資培訓課程</option></select></div><div><label for="classCode">教師課程代碼（雲端存檔用）</label><input id="classCode" autocomplete="off"></div></div><p class="note" id="connection"></p><p class="hint">教學演練版，對應您提供的 iCAP 格式；不代表正式申請或認證。請填模擬資料，勿填病人／住民個資。共用電腦使用後請清除草稿。備份含個人作業續填密鑰，請自行保管。</p><div class="actions"><a class="button secondary" href="https://chatgptcjcu-boop.github.io/healthcare-quality-course-planner/case.html" target="_blank">閱讀完整長照案例</a><button id="caseLoad" class="secondary">載入長照完整教學案例</button><button id="backup" class="secondary">下載整份備份</button><label class="button secondary">匯入備份<input id="import" type="file" accept="application/json" hidden></label><button id="loadCloud" class="secondary">讀回我的雲端存檔</button><button id="print" class="secondary">列印整份報告</button><button id="reset" class="secondary">開始新企劃</button></div><details><summary>貼上備份內容</summary><p class="hint">載入會替換本機草稿；請先下載目前備份。雲端歷史不會刪除。</p><label for="backupText">完整備份 JSON 內容</label><textarea id="backup
